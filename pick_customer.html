{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<h4 style="color:#1f3864;">{{ title }}</h4>
<p class="text-muted small">{{ intro }}</p>
<div class="card shadow-sm" style="max-width:640px;"><div class="card-body">
{% if customers %}
<form method="post" class="row g-2 align-items-end">
  <div class="col-md-9">
    <label class="form-label small">Customer</label>
    <select class="form-select form-select-sm" name="cid" required>
      <option value="">— choose customer —</option>
      {% for c in customers %}<option value="{{ c.id }}">{{ c.cust_ref }} · {{ c.name }} ({{ c.currency }})</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <button class="btn btn-sm btn-primary w-100" style="background:#1f3864;border:0;">Continue</button>
  </div>
</form>
{% else %}
<div class="text-muted small">No eligible customers found.</div>
{% endif %}
</div></div>
{% endblock %}
